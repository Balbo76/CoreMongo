services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/nginx/nginx.prod-www.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - react-express

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    restart: always
    volumes:
      - ./deploy/nginx/frontend.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - react-express
    depends_on:
      - backend

  backend:
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://admin:pass@mongo:27017/provolone?authSource=admin
      - JWT_SECRET=una_stringa_segreta_e_molto_lunga_per_i_token_jwt
    depends_on:
      - mongo
    networks:
      - express-mongo
      - react-express

  mongo:
    restart: always
    image: mongo:6.0
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - express-mongo
    expose:
      - 27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass

networks:
  react-express:
  express-mongo:

volumes:
  mongo_prod_data:
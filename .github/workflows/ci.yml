name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Linting
        run: npm run lint

      - name: Build Shared Package
        run: npm run build -w shared

      - name: Backend Build & Typecheck
        run: npm run build -w backend

      - name: Backend Tests
        run: npm test -w backend
        env:
          JWT_SECRET: ci_test_secret

      - name: Frontend Typecheck
        run: npm run typecheck -w frontend

      - name: Frontend Build
        run: npm run build -w frontend
